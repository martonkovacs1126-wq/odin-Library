<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="header">
      <h1>Library</h1>
      <div class="container">
        <p>Add new book:</p>
        <form id="addbook">
          <input id="title" name="title" placeholder="Book title">
          <input id="author" name="author" placeholder="Author of the book">
          <input id="pages" type="number" name="pages" placeholder="Number of pages">
          <select name="read" id="read">
            <option selected="selected" disabled>Have you read it?</option>
            <option value="true">Yes</option>
            <option value="false">No</option>
          </select>
          <button type="submit" id="pushbtn">Add book</button>
        </form>
      </div>
    </div>
    <hr>
    <div class="cardcontainer">
      
    </div>
  </body>
</html>
